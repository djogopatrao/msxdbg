[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msxdbg"
version = "0.11.0rc1"
description = "Attach-only source debugger for SDCC programs running in openMSX"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "msxdbg contributors"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
msxdbg = "msxdbg.__main__:main"

[tool.setuptools.packages.find]
include = ["msxdbg*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--strict-markers"
markers = [
  "live: requires an operator-prepared openMSX instance and explicit opt-in",
]
